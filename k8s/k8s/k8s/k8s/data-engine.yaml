cat > ~/Desktop/f1-performance-analyzer/k8s/data-engine.yaml << 'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-engine
  template:
    metadata:
      labels:
        app: data-engine
    spec:
      containers:
      - name: data-engine
        image: f1-performance-analyzer-data-engine:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: data-engine
spec:
  type: NodePort
  selector:
    app: data-engine
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30002
EOF